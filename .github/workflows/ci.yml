name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (wrangler dry-run)
        run: |
          # wrangler dry-run 会校验 wrangler.toml 里的 KV id 格式，
          # 占位符 REPLACE_WITH_YOUR_KV_ID 不合法，临时替换成 32 位 hex 才能本地打包
          # （仅改 CI 副本，不动仓库文件；真实部署请在 wrangler.toml 填你的 KV id）
          sed -i 's/REPLACE_WITH_YOUR_KV_ID/00000000000000000000000000000000/' wrangler.toml
          npm run dryrun
