name = "qinglong-checkin"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# UTC 时间：00:08 CST 聚合签到（WorkBuddy/Trae/MiniMax），10:55 仅美团
[triggers]
crons = ["8 16 * * *", "55 2 * * *"]

[[kv_namespaces]]
binding = "CHECKIN_STATE"
id = "REPLACE_WITH_YOUR_KV_ID" # TODO：换成真实 KV id

# 明文配置；敏感项走 wrangler secret put，清单见 README
[vars]
WB_USER_ID = ""
TRAE_DEVICE_ID = ""
TRAE_USER_ID = ""
TRAE_MACHINE_ID = ""
MINIMAX_USER_ID = ""
MINIMAX_UUID = ""
MINIMAX_DEVICE_ID = ""
MT_CLIENT_ID = ""
MT_AISCENE = ""
